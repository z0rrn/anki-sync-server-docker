name: Build and push image

on:
  pull_request:
    paths:
      - "anki-version"
  push:
    paths:
      - "anki-version"
  workflow_dispatch:
    inputs:
      ssh_session:
        description: "Enable interactive SSH debugging session"
        type: boolean
        required: false
        default: false

jobs:
  build-platform-image:
    name: Build ${{ matrix.platform }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            tag_suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/386
            tag_suffix: 386
            runner: ubuntu-24.04
          - platform: linux/arm64
            tag_suffix: arm64
            runner: ubuntu-24.04-arm
          - platform: linux/arm/v7
            tag_suffix: armv7
            runner: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Anki version
        id: anki_version
        run: echo "version=$(cat ./anki-version)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: f7zorn
          password: ${{ github.ref == 'refs/heads/main' && secrets.GH_PUSH_GHCR_ANKI || secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: docker.io
          username: zorrn
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker get metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && 'ghcr.io/f7zorn/anki-sync-server-dev' || 'ghcr.io/f7zorn/anki-sync-server' }}
            ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'ghcr.io/z0rrn/anki-sync-server' || '' }}
            ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'docker.io/zorrn/anki-sync-server' || '' }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=build-${{ github.run_id }}-${{ matrix.tag_suffix }}
          labels: |
            org.opencontainers.image.title=Anki Sync Server
            org.opencontainers.image.url=https://github.com/f7zorn/anki-sync-server-docker
            org.opencontainers.image.description=Anki Sync Server is a third-party image that provides a server for syncing Anki decks.
            org.opencontainers.image.source=https://github.com/f7zorn/anki-sync-server-docker
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
            org.opencontainers.image.revision={{sha}}
            org.opencontainers.image.version=${{ steps.anki_version.outputs.version }}

      - name: Build platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' }}
          build-args: |
            ANKI_VERSION=${{ steps.anki_version.outputs.version }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.tag_suffix }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.tag_suffix }}

      # Enable ssh debugging of manually-triggered workflows if the input option was provided
      - name: Setup interactive ssh session
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ssh_session }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        timeout-minutes: 20
        with:
          limit-access-to-actor: true

  publish-multi-arch-image:
    name: Publish multi-arch image
    if: github.event_name == 'push'
    needs: [build-platform-image]
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Anki version
        id: anki_version
        run: echo "version=$(cat ./anki-version)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: f7zorn
          password: ${{ github.ref == 'refs/heads/main' && secrets.GH_PUSH_GHCR_ANKI || secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.ref_name == 'main'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: docker.io
          username: zorrn
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker get final metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/f7zorn/anki-sync-server' || 'ghcr.io/f7zorn/anki-sync-server-dev' }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/z0rrn/anki-sync-server' || '' }}
            ${{ github.ref == 'refs/heads/main' && 'docker.io/zorrn/anki-sync-server' || '' }}
          flavor: |
            latest=false
            prefix=${{ github.ref_name != 'main' && format('branch-{0}-', github.ref_name) || '' }}
          tags: |
            # latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}},priority=950
            # anki version
            type=raw,value=${{ steps.anki_version.outputs.version }},priority=900
            # git commit hash (12 characters)
            type=sha
            # pr tag/number (kept for consistency with the previous tag scheme)
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Anki Sync Server
            org.opencontainers.image.url=https://github.com/f7zorn/anki-sync-server-docker
            org.opencontainers.image.description=Anki Sync Server is a third-party image that provides a server for syncing Anki decks.
            org.opencontainers.image.source=https://github.com/f7zorn/anki-sync-server-docker
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
            org.opencontainers.image.revision={{sha}}
            org.opencontainers.image.version=${{ steps.anki_version.outputs.version }}

      - name: Publish one manifest for each final tag
        env:
          FINAL_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -eu

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue

            case "$tag" in
              ghcr.io/f7zorn/anki-sync-server:*)
                image='ghcr.io/f7zorn/anki-sync-server'
                ;;
              ghcr.io/f7zorn/anki-sync-server-dev:*)
                image='ghcr.io/f7zorn/anki-sync-server-dev'
                ;;
              ghcr.io/z0rrn/anki-sync-server:*)
                image='ghcr.io/z0rrn/anki-sync-server'
                ;;
              docker.io/zorrn/anki-sync-server:*)
                image='docker.io/zorrn/anki-sync-server'
                ;;
              *)
                echo "Unexpected metadata tag: $tag" >&2
                exit 1
                ;;
            esac

            docker buildx imagetools create \
              --tag "$tag" \
              "$image:build-${GITHUB_RUN_ID}-amd64" \
              "$image:build-${GITHUB_RUN_ID}-386" \
              "$image:build-${GITHUB_RUN_ID}-arm64" \
              "$image:build-${GITHUB_RUN_ID}-armv7"
          done <<< "$FINAL_TAGS"

      # Enable ssh debugging of manually-triggered workflows if the input option was provided
      - name: Setup interactive ssh session
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ssh_session }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        timeout-minutes: 20
        with:
          limit-access-to-actor: true
